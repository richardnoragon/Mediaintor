[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediainator"
version = "0.1.0a1"
description = "Media-inator Hub and Book-inator desktop foundation"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.10,<7"]

[project.scripts]
mediainator = "mediainator.__main__:main"

[tool.setuptools.packages.find]
include = ["mediainator*"]
